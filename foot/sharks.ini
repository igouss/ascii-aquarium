# foot for the sharks scene. ascii-sharks sizes its cells to the screen: 13 px
# wide, 1.45 times as tall, on a 2560-wide screen. JetBrains Mono at this
# pixel size advances 13 px; line-height sets the 19 px row.
[main]
font=JetBrainsMono Nerd Font:pixelsize=21.6
line-height=19px
pad=0x0

[colors-dark]
background=000000
foreground=ffffff
